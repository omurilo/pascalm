[package]
name = "pascalmls"
version = "0.1.0"
edition = "2021"

[dependencies]
pascalm = { path = "../../" }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tower-lsp = "0.20.0"
dashmap = "6.2.1"
crop = "0.4.3"
log = "0.4.31"
anyhow = "1.0.102"
env_logger = "0.11.10"
lalrpop-util = "0.20"

[[bin]]
name = "pascalmls"
path = "src/server.rs"
