[package]
name = "net"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json"] }
tokio = { version = "1.52", features = ["full"] }

[lib]
crate-type = ["staticlib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
